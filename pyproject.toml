[project]
name = "app"
version = "0.1.0"
description = "FastAPI + Pydantic + PostgreSQL API server"
requires-python = ">=3.14,<4.0"
dependencies = [
    "email-validator>=2.1.0.post1,<3.0.0",
    "fastapi[standard]>=0.141.1,<1.0.0",
    "psycopg[binary,pool]>=3.3.6,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1,<1.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    "sentry-sdk[fastapi]>=2.70.0,<3.0.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0,<2.0.0",
    "coverage>=7.4.3,<8.0.0",
    "httpx>=0.25.1,<1.0.0",
    "pytest>=7.4.3,<10.0.0",
    "ruff>=0.16.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001",  # unused arguments in functions
    "T201",  # print statements are not allowed
]
ignore = [
    "E501",  # line length is the formatter's concern, not a lint error
    "B008",  # FastAPI depends on calls in argument defaults (Depends, Query, ...)
    "B904",  # allow raising HTTPException without `from`
]

[tool.ruff.lint.per-file-ignores]
# The migration runner is a CLI: printing progress is its interface.
"migrations/run.py" = ["T201"]

# Type checking. Kept deliberately identical for the CLI (uv run basedpyright)
# and the basedpyright language server in Zed: both read this table.
[tool.basedpyright]
include = ["app", "tests", "migrations"]
exclude = [".venv", "htmlcov", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.fastapi]
entrypoint = "app.main:app"
